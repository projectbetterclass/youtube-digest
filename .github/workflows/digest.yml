name: Daily YouTube Digest

on:
  schedule:
    # Every 8h (06:00 / 14:00 / 22:00 UTC) — aggressive backfill pace. https://crontab.guru/
    - cron: "0 6,14,22 * * *"
  workflow_dispatch: {}  # run on demand from the Actions tab

permissions:
  contents: write   # commit state + digests back to the repo
  issues: write     # open the digest Issue (delivery/notification)

concurrency:
  group: youtube-digest
  cancel-in-progress: false

jobs:
  digest:
    # GitHub-hosted cloud runner — no PC required. Transcripts go through the
    # Webshare residential proxy (secrets), which is what makes cloud viable now.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WEBSHARE_PROXY_USERNAME: ${{ secrets.WEBSHARE_PROXY_USERNAME }}
          WEBSHARE_PROXY_PASSWORD: ${{ secrets.WEBSHARE_PROXY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/run.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "digest: update $(date -u +%Y-%m-%d)"
            # The self-hosted visuals job is a second writer to main; rebase our commit
            # on top of anything it pushed (disjoint files, so this is always clean).
            git pull --rebase
            git push
          fi
