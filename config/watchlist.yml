# ── YouTube Digest watchlist ─────────────────────────────────────────────
# Add one entry per channel. You need each channel's `channel_id` (starts with
# "UC..."). To find one, run:
#     python scripts/resolve_channel.py https://www.youtube.com/@SomeHandle

settings:
  # Claude model for the daily briefs. Haiku is cheap + fast.
  model: claude-haiku-4-5

  # Only summarize new videos published within this many days (also the "missed a
  # day" catch-up window if the PC was off).
  max_age_days: 5

  # Preferred caption languages, in order. First available wins.
  transcript_languages: [en]

  # Politeness spacing (seconds) between channel feed fetches.
  request_delay_seconds: 1.0

  # Cap on NEW videos summarized per run (spreads bursts so they don't trip
  # YouTube's transcript rate limit).
  max_videos_per_run: 20

  # Back-catalog drip: how many PAST videos to import per run (transcripts only).
  # Raise to backfill faster, but YouTube's per-IP transcript limit caps the real rate.
  backfill_budget_per_run: 10

# Per channel, add `backfill: N` to import that channel's N most-recent PAST videos
# (transcripts only, dripped in slowly over days). Omit it (or 0) = new uploads only.
channels:
